        name: return_received_at__lte
        schema:
          type: string
          format: date-time
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - confirmed
          - failed
          - pending
          - refunded
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `completed` - Completed
          * `failed` - Failed
          * `cancelled` - Cancelled
          * `refunded` - Refunded
