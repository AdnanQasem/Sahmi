components:
  schemas:
    AdminInvestment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        investor:
          type: string
          format: uuid
        investor_detail:
          allOf:
          - $ref: '#/components/schemas/AdminInvestmentUserSummary'
          readOnly: true
        project:
          type: string
          format: uuid
        project_detail:
          allOf:
          - $ref: '#/components/schemas/AdminInvestmentProjectSummary'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        investment_date:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/Status784Enum'
        pending_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        transaction_id:
          type: string
          maxLength: 120
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        expected_return:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        actual_return:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        return_received_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - investment_date
      - investor
      - investor_detail
      - pending_expires_at
      - project
      - project_detail
      - updated_at
    AdminInvestmentProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/AdminInvestmentProjectSummaryStatusEnum'
        is_verified:
          type: boolean
      required:
      - id
      - slug
      - title
    AdminInvestmentProjectSummaryStatusEnum:
      enum:
      - draft
      - fundraising
      - fully_funded
      - implementation
      - completed
      - failed
      - paused
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `fundraising` - Fundraising
        * `fully_funded` - Fully Funded
        * `implementation` - Implementation
        * `completed` - Completed
        * `failed` - Failed
        * `paused` - Paused
        * `cancelled` - Cancelled
    AdminInvestmentUserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
      required:
      - email
      - full_name
      - id
    AdminMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        project_detail:
          allOf:
          - $ref: '#/components/schemas/AdminInvestmentProjectSummary'
          readOnly: true
        title:
          type: string
          maxLength: 120
        description:
          type: string
        target_date:
          type: string
          format: date
        actual_completion_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/Status971Enum'
        deliverables:
          type: string
        percentage_of_project:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        funding_released:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - funding_released
      - id
      - percentage_of_project
      - project
      - project_detail
      - target_date
      - title
      - updated_at
    AdminPasswordReset:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - password
    AdminProject:
      type: object
